<!DOCTYPE html>
<html>
<head>
    <title>Profile Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 250px;
            padding: 15px;
            background-color: #f9f9f9;
            color: #333;
        }
        h3 {
            margin-top: 0;
            font-size: 16px;
            color: #f1641e; /* Etsy orange */
        }
        label {
            font-size: 12px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 5px;
        }
        button {
            width: 100%;
            background-color: #f1641e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #d1561a;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: green;
            text-align: center;
            min-height: 14px;
        }
        .req {
            color: #c0392b;
            font-weight: normal;
        }
        .hint {
            font-size: 11px;
            line-height: 1.4;
            color: #666;
            margin: 6px 0 0;
        }
        .hint.warn {
            color: #c0392b;
        }
    </style>
</head>
<body>
    <h3>Scraper Profile</h3>
    <label for="profileName">Profile Name:</label>
    <input type="text" id="profileName" placeholder="e.g. Seller_Account_1">
    
    <label for="profileRole">Etsy account in this browser:</label>
    <select id="profileRole">
        <option value="">— not signed in to Etsy —</option>
        <option value="etsy_public">Buyer account (public scraping)</option>
        <option value="etsy_private">My seller account (Shop Manager)</option>
    </select>
    <p class="hint">
        Only Etsy needs this — we can't tell a buyer login from a seller login by
        looking. <strong>Pinterest syncs automatically</strong>, so you can keep
        both open in one browser.
    </p>
    <p class="hint warn">
        Don't mark a seller-logged-in browser as <em>Buyer</em> — that puts your
        seller session in the competitor-scraping pool.
    </p>

    <button id="saveBtn">Save Settings</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
