# Four services, two of which are the access layer and are not to be edited casually.
#
#   SERVICE          CONTAINER           ROLE                                  EDIT?
#   redis            scraper-redis       THE VAULT. db 0 shared (extension +   no
#                                        pinterest-apify), db 1 our mirror.
#   go-api           cookie-server-go    Receives cookies from the Chrome      ACCESS LAYER
#                                        extension, writes them to db 0.       — do not edit
#   python-scraper   python-scraper      Idle exec container for running       yes
#                                        pipelines inside Docker.
#   etsy-server      etsy-server         Optional FastAPI read server (D-42).  yes
#
# The names look inconsistent and are deliberately left alone: `go-api` is quoted
# in core/preflight.py and core/vault_status.py error text ("docker compose up -d
# redis go-api") and in three docs, and renaming a service forces Docker to
# recreate the container. The vault itself would survive — the volume is
# `etsyscrapper_redis_data`, keyed on the compose PROJECT name and the `redis_data`
# key below, not on any service name — but a rename buys nothing except tidier
# YAML and costs a restart of a working session pool. Not worth it.
#
# ⚠️ Renaming the FOLDER would change the compose project name, and the volume with
# it — that is how you would actually lose the vault. Don't.

version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: scraper-redis
    ports:
      # Exposing for local debugging if needed, but internally accessible on 6379
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - scraper_network

  go-api:
    build: 
      context: ./cookie_server_go
    container_name: cookie-server-go
    ports:
      - "8000:8000"
    environment:
      # db 0 — the SHARED vault, and it must stay that way. One Chrome extension
      # feeds this server, and the pinterest-apify project reads db 0 directly.
      # Pointing the writer at db 1 would starve that project while looking fine
      # from here. This project reads its own copy via core/vault_mirror.py.
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=super_secret_key_123
    depends_on:
      - redis
    networks:
      - scraper_network

  python-scraper:
    build:
      context: .
    container_name: python-scraper
    environment:
      # db 1 — this project's PRIVATE vault. core/vault_mirror.py copies the
      # shared sessions in one-way, so our evictions and prunes cannot reach the
      # other project's data.
      - REDIS_URL=redis://redis:6379/1
      - VAULT_SOURCE_URL=redis://redis:6379/0
      # Include any other env vars like CAPSOLVER_API_KEY
    depends_on:
      - redis
    volumes:
      - .:/app
    networks:
      - scraper_network

  # The optional read server (etsy/server/app.py, D-42). NOT part of the access
  # layer — it only reads the database and, on POST /api/analyze, makes an
  # OUTBOUND call to Etsy/Printify using sessions the vault already holds. It
  # does not touch cookie_server_go or the Chrome extension's write path.
  #
  # HOST=0.0.0.0 below is the container's OWN interface, not the host's — a
  # process inside Docker must bind 0.0.0.0 to be reachable through the port
  # mapping at all. The safety knob is the port mapping itself: it is pinned to
  # 127.0.0.1 on the HOST, so this container is exactly as exposed as running
  # `run_server.cmd` directly (D-42's "no auth" warning still applies — only
  # widen this to "8100:8100" if you deliberately want it on the LAN).
  etsy-server:
    build:
      context: .
    container_name: etsy-server
    command: python -m etsy.server.app
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - REDIS_URL=redis://redis:6379/1
      - VAULT_SOURCE_URL=redis://redis:6379/0
      - HOST=0.0.0.0
      - PORT=8100
    depends_on:
      - redis
    volumes:
      - .:/app
    networks:
      - scraper_network

volumes:
  redis_data:

networks:
  scraper_network:
    driver: bridge
